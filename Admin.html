<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة تحكم الأدمن - Google Sheets</title>
  <style>
    body { font-family: sans-serif; background: #121212; color: #fff; text-align: center; padding: 40px; }
    .card { background: #1e1e1e; padding: 25px; border-radius: 12px; max-width: 450px; margin: 0 auto; border: 1px solid #333; box-shadow: 0 4px 15px rgba(0,0,0,0.6); }
    input, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; box-sizing: border-box; }
    input { background: #2a2a2a; color: #fff; border: 1px solid #444; }
    button { background: #ffc107; color: #000; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background: #e0a800; }
    h2 { color: #ffc107; }
  </style>
</head>
<body>

  <div class="card">
    <h2>🛠️ لوحة تحكم الأدمن</h2>
    <p style="color: #aaa; font-size: 13px;">أضف طالب جديد وسجل بياناته في جوجل شيت مباشرة</p>
    
    <input type="email" id="new-email" placeholder="البريد الإلكتروني للطالب">
    <input type="password" id="new-password" placeholder="كلمة السر">
    <input type="number" id="new-balance" placeholder="الرصيد المبدئي (مثلاً 100)">
    
    <button onclick="addNewStudent()">إضافة الطالب للشيت 🚀</button>
    <p id="admin-msg" style="font-size: 14px; margin-top: 15px;"></p>
  </div>

  <script>
    const API_URL = 'https://sheetdb.io/api/v1/cniwo746z5aba';

    async function addNewStudent() {
      let email = document.getElementById('new-email').value.trim();
      let password = document.getElementById('new-password').value.trim();
      let balance = document.getElementById('new-balance').value.trim();
      let msg = document.getElementById('admin-msg');

      if (!email || !password || !balance) {
        msg.style.color = "#ff4d4d";
        msg.innerText = "برجاء ملء جميع الحقول يا فنان!";
        return;
      }

      msg.style.color = "#ffc107";
      msg.innerText = "جاري إضافة الطالب للشيت...";

      try {
        let response = await fetch(API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            data: {
              email: email,
              password: password,
              الرصيد: Number(balance),
              المشاهدات: ""
            }
          })
        });

        if (response.ok) {
          msg.style.color = "#28a745";
          msg.innerText = "تم إضافة الطالب بنجاح وربط الشيت! 🎉";
          document.getElementById('new-email').value = "";
          document.getElementById('new-password').value = "";
          document.getElementById('new-balance').value = "";
        } else {
          msg.style.color = "#ff4d4d";
          msg.innerText = "حدث خطأ أثناء الإضافة.";
        }
      } catch (err) {
        msg.style.color = "#ff4d4d";
        msg.innerText = "خطأ في الاتصال: " + err.message;
      }
    }
  </script>
</body>
</html>
