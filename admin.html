<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة تحكم الأدمن - المنصة التعليمية</title>
  <style>
    body { font-family: sans-serif; background: #121212; color: #fff; text-align: center; padding: 20px; }
    .card { background: #1e1e1e; padding: 20px; border-radius: 12px; max-width: 500px; margin: 15px auto; border: 1px solid #333; box-shadow: 0 4px 15px rgba(0,0,0,0.6); text-align: right; }
    h2 { text-align: center; color: #ffc107; }
    label { font-size: 13px; color: #aaa; display: block; margin-top: 10px; }
    input, button { width: 100%; padding: 10px; margin: 5px 0 10px 0; border-radius: 8px; border: none; box-sizing: border-box; }
    input { background: #2a2a2a; color: #fff; border: 1px solid #444; }
    button { font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn-add { background: #28a745; color: #fff; }
    .btn-add:hover { background: #218838; }
    .btn-charge { background: #ffc107; color: #000; }
    .btn-charge:hover { background: #e0a800; }
    .btn-delete { background: #dc3545; color: #fff; }
    .btn-delete:hover { background: #c82333; }
    .btn-refresh { background: #17a2b8; color: #fff; margin-bottom: 15px; }
    .btn-refresh:hover { background: #138496; }
    .msg { font-size: 13px; text-align: center; margin-top: 5px; }

    /* جدول عرض الطلاب */
    .table-card { max-width: 800px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; text-align: center; }
    th, td { border: 1px solid #444; padding: 10px; }
    th { background: #222; color: #ffc107; }
    tr:nth-child(even) { background: #181818; }
  </style>
</head>
<body>

  <!-- 1. جدول عرض جميع الطلاب المسجلين -->
  <div class="card table-card">
    <h2>👥 قائمة جميع الطلاب المسجلين</h2>
    <button class="btn-refresh" onclick="loadStudents()">تحديث القائمة 🔄</button>
    <div style="overflow-x: auto;">
      <table>
        <thead>
          <tr>
            <th>البريد الإلكتروني</th>
            <th>كلمة السر</th>
            <th>الرصيد</th>
            <th>المشاهدات</th>
          </tr>
        </thead>
        <tbody id="students-table-body">
          <tr><td colspan="4" style="color: #aaa;">جاري تحميل البيانات...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- 2. إضافة طالب جديد -->
  <div class="card">
    <h2>➕ إضافة طالب جديد</h2>
    <label>إيميل الطالب:</label>
    <input type="email" id="add-email" placeholder="student@example.com">
    <label>كلمة السر:</label>
    <input type="password" id="add-password" placeholder="******">
    <label>الرصيد المبدئي:</label>
    <input type="number" id="add-balance" placeholder="100">
    <button class="btn-add" onclick="addNewStudent()">حفظ وإضافة للشيت 🚀</button>
    <p id="msg-add" class="msg"></p>
  </div>

  <!-- 3. شحن رصيد طالب -->
  <div class="card">
    <h2>💳 شحن رصيد طالب</h2>
    <label>إيميل الطالب المسجل:</label>
    <input type="email" id="charge-email" placeholder="student@example.com">
    <label>المبلغ المراد إضافته (أو خصمه):</label>
    <input type="number" id="charge-amount" placeholder="50">
    <button class="btn-charge" onclick="chargeStudent()">تحديث الرصيد ⚡</button>
    <p id="msg-charge" class="msg"></p>
  </div>

  <!-- 4. حذف طالب -->
  <div class="card">
    <h2>🗑️ حذف طالب من المنصة</h2>
    <label>إيميل الطالب المراد حذفه:</label>
    <input type="email" id="delete-email" placeholder="student@example.com">
    <button class="btn-delete" onclick="deleteStudent()">حذف نهائي من الشيت ⚠️</button>
    <p id="msg-delete" class="msg"></p>
  </div>

  <script>
    const API_URL = 'https://sheetdb.io/api/v1/cniwo746z5aba';

    // تحميل وعرض الطلاب تلقائياً أول ما الصفحة تفتح
    window.onload = function() {
      loadStudents();
    };

    // جلب وعرض الطلاب في الجدول
    async function loadStudents() {
      let tbody = document.getElementById('students-table-body');
      tbody.innerHTML = `<tr><td colspan="4" style="color: #aaa;">جاري التحديث...</td></tr>`;

      try {
        let res = await fetch(API_URL);
        let data = await res.json();

        if (!data || data.length === 0) {
          tbody.innerHTML = `<tr><td colspan="4" style="color: #ff4d4d;">لا يوجد طلاب مسجلين حالياً!</td></tr>`;
          return;
        }

        tbody.innerHTML = "";
        data.forEach(student => {
          let email = student.email || "";
          let password = student.password || "";
          let balance = student.الرصيد !== undefined ? student.الرصيد : (student.balance || 0);
          let watched = student.المشاهدات || student.watched || "لا يوجد";

          let row = `<tr>
            <td>${email}</td>
            <td>${password}</td>
            <td style="color: #28a745; font-weight: bold;">${balance} ج.م</td>
            <td>${watched}</td>
          </tr>`;
          tbody.innerHTML += row;
        });

      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="4" style="color: #ff4d4d;">خطأ في الاتصال بالشيت!</td></tr>`;
      }
    }

    // 1. إضافة طالب
    async function addNewStudent() {
      let email = document.getElementById('add-email').value.trim();
      let password = document.getElementById('add-password').value.trim();
      let balance = document.getElementById('add-balance').value.trim();
      let msg = document.getElementById('msg-add');

      if (!email || !password || !balance) {
        msg.style.color = "#ff4d4d";
        msg.innerText = "برجاء ملء جميع الحقول!";
        return;
      }

      msg.style.color = "#ffc107";
      msg.innerText = "جاري الإضافة...";

      try {
        let res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            data: { email: email, password: password, الرصيد: Number(balance), المشاهدات: "" }
          })
        });

        if (res.ok) {
          msg.style.color = "#28a745";
          msg.innerText = "تمت الإضافة بنجاح! 🎉";
          document.getElementById('add-email').value = "";
          document.getElementById('add-password').value = "";
          document.getElementById('add-balance').value = "";
          loadStudents(); // تحديث الجدول أوتوماتيك
        } else {
          msg.style.color = "#ff4d4d";
          msg.innerText = "حدث خطأ أثناء الإضافة.";
        }
      } catch (err) {
        msg.style.color = "#ff4d4d";
        msg.innerText = "خطأ في الاتصال: " + err.message;
      }
    }

    // 2. شحن رصيد الطالب
    async function chargeStudent() {
      let email = document.getElementById('charge-email').value.trim().toLowerCase();
      let amount = Number(document.getElementById('charge-amount').value);
      let msg = document.getElementById('msg-charge');

      if (!email || isNaN(amount)) {
        msg.style.color = "#ff4d4d";
        msg.innerText = "برجاء إدخال الإيميل والمبلغ بشكل صحيح!";
        return;
      }

      msg.style.color = "#ffc107";
      msg.innerText = "جاري تحديث الرصيد...";

      try {
        let response = await fetch(API_URL);
        let data = await response.json();

        let student = data.find(s => String(s.email).trim().toLowerCase() === email);
        if (!student) {
          msg.style.color = "#ff4d4d";
          msg.innerText = "لم يتم العثور على طالب بهذا الإيميل!";
          return;
        }

        let oldBalance = Number(student.الرصيد || student.balance || 0);
        let newBalance = oldBalance + amount;

        let updateRes = await fetch(`${API_URL}/email/${encodeURIComponent(email)}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            data: { الرصيد: newBalance }
          })
        });

        if (updateRes.ok) {
          msg.style.color = "#28a745";
          msg.innerText = `تم شحن الرصيد بنجاح! الرصيد الجديد: ${newBalance} ج.م ⚡`;
          document.getElementById('charge-email').value = "";
          document.getElementById('charge-amount').value = "";
          loadStudents(); // تحديث الجدول أوتوماتيك
        } else {
          msg.style.color = "#ff4d4d";
          msg.innerText = "فشل تحديث الرصيد.";
        }
      } catch (err) {
        msg.style.color = "#ff4d4d";
        msg.innerText = "خطأ في الاتصال: " + err.message;
      }
    }

    // 3. حذف طالب
    async function deleteStudent() {
      let email = document.getElementById('delete-email').value.trim().toLowerCase();
      let msg = document.getElementById('msg-delete');

      if (!email) {
        msg.style.color = "#ff4d4d";
        msg.innerText = "برجاء كتابة إيميل الطالب المراد حذفه!";
        return;
      }

      if (!confirm(`هل أنت متأكد من حذف الطالب ${email} نهائياً؟`)) return;

      msg.style.color = "#ffc107";
      msg.innerText = "جاري الحذف...";

      try {
        let res = await fetch(`${API_URL}/email/${encodeURIComponent(email)}`, {
          method: 'DELETE'
        });

        if (res.ok) {
          msg.style.color = "#28a745";
          msg.innerText = "تم حذف الطالب بنجاح! 🗑️";
          document.getElementById('delete-email').value = "";
          loadStudents(); // تحديث الجدول أوتوماتيك
        } else {
          msg.style.color = "#ff4d4d";
          msg.innerText = "لم يتم العثور على الطالب أو حدث خطأ بالحذف.";
        }
      } catch (err) {
        msg.style.color = "#ff4d4d";
        msg.innerText = "خطأ في الاتصال: " + err.message;
      }
    }
  </script>
</body>
</html>
