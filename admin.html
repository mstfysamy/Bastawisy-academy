<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة تحكم الأدمن - Bastawisy-academy</title>
  <style>
    body { font-family: sans-serif; background: #121212; color: #fff; text-align: center; padding: 20px; }
    .card { background: #1e1e1e; padding: 20px; border-radius: 12px; max-width: 500px; margin: 20px auto; border: 1px solid #333; }
    input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: none; box-sizing: border-box; }
    input { background: #2a2a2a; color: #fff; }
    button { background: #007bff; color: #fff; font-weight: bold; cursor: pointer; }
    button:hover { background: #0056b3; }
    .success-btn { background: #28a745; }
    .success-btn:hover { background: #218838; }
    .danger-btn { background: #dc3545; }
    .danger-btn:hover { background: #c82333; }
    table { width: 100%; font-size: 13px; margin-top: 15px; border-collapse: collapse; }
    th, td { border: 1px solid #444; padding: 8px; text-align: center; }
  </style>
</head>
<body>

  <h2>🛠️ لوحة تحكم الأدمن</h2>

  <div class="card">
    <h3>إضافة طالب جديد للمنصة</h3>
    <input type="email" id="new-email" placeholder="البريد الإلكتروني للطالب">
    <input type="password" id="new-password" placeholder="كلمة السر">
    <input type="number" id="new-balance" placeholder="الرصيد الابتدائي (مثال: 100)">
    <button class="success-btn" onclick="addNewStudent()">إضافة الطالب</button>
    
    <h3 style="margin-top: 25px;">قائمة الطلاب المسجلين وشحن الرصيد</h3>
    <table>
      <thead>
        <tr>
          <th>الإيميل</th>
          <th>الرصيد</th>
          <th>شحن</th>
          <th>حذف</th>
        </tr>
      </thead>
      <tbody id="students-table-body"></tbody>
    </table>

    <br>
    <a href="index.html" style="color: #00d2ff; text-decoration: none; display: block; margin-top: 15px;">⬅️ الانتقال لصفحة دخول الطلاب (الموقع الرئيسي)</a>
  </div>

  <script>
    function getStudents() {
      let data = localStorage.getItem('app_students');
      if (!data) return [];
      return JSON.parse(data);
    }

    function saveStudents(students) {
      localStorage.setItem('app_students', JSON.stringify(students));
    }

    function renderStudentsTable() {
      let students = getStudents();
      let tbody = document.getElementById('students-table-body');
      tbody.innerHTML = "";
      
      if (students.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" style="color: #aaa;">لا توجد حسابات مسجلة حالياً</td></tr>`;
        return;
      }

      students.forEach((s, index) => {
        tbody.innerHTML += `
          <tr>
            <td>${s.email}</td>
            <td style="color: #28a745; font-weight: bold;">${s.balance} ج.م</td>
            <td><button onclick="addBalance(${index})" style="padding: 5px; background: #ffc107; color: #000; width: auto;">شحن</button></td>
            <td><button class="danger-btn" onclick="deleteStudent(${index})" style="padding: 5px; width: auto;">حذف</button></td>
          </tr>`;
      });
    }

    function addNewStudent() {
      let email = document.getElementById('new-email').value.trim().toLowerCase();
      let password = document.getElementById('new-password').value.trim();
      let balance = Number(document.getElementById('new-balance').value) || 0;

      if (!email || !password) {
        alert("برجاء إدخال الإيميل وكلمة السر!");
        return;
      }

      let students = getStudents();
      let exists = students.find(s => s.email.toLowerCase() === email);
      if (exists) {
        alert("هذا الإيميل مسجل مسبقاً!");
        return;
      }

      students.push({ email, password, balance, views: {} });
      saveStudents(students);
      
      alert("تم إضافة الطالب بنجاح! ✅");
      document.getElementById('new-email').value = "";
      document.getElementById('new-password').value = "";
      document.getElementById('new-balance').value = "";
      renderStudentsTable();
    }

    function addBalance(index) {
      let amount = prompt("أدخل المبلغ المراد شحنه للطالب:");
      if (amount !== null && !isNaN(amount) && amount !== "") {
        let students = getStudents();
        students[index].balance += Number(amount);
        saveStudents(students);
        alert("تم شحن الرصيد بنجاح! 💰");
        renderStudentsTable();
      }
    }

    function deleteStudent(index) {
      if (confirm("هل أنت متأكد من حذف هذا الطالب؟")) {
        let students = getStudents();
        students.splice(index, 1);
        saveStudents(students);
        renderStudentsTable();
      }
    }

    // أول ما الصفحة تفتح هات جدول الطلاب
    renderStudentsTable();
  </script>
</body>
</html>
