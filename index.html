<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة الطلاب التعليمية</title>
  <style>
    body { font-family: sans-serif; background: #121212; color: #fff; margin: 0; padding: 0; box-sizing: border-box; }
    .container { max-width: 650px; margin: 30px auto; padding: 15px; }
    .card { background: #1e1e1e; padding: 20px; border-radius: 12px; border: 1px solid #333; margin-bottom: 20px; }
    h2 { color: #ffc107; text-align: center; margin-bottom: 20px; font-size: 18px; }
    label { font-size: 13px; color: #aaa; display: block; margin-top: 10px; }
    input, select, button { width: 100%; padding: 12px; margin: 6px 0 12px 0; border-radius: 8px; border: none; box-sizing: border-box; }
    input, select { background: #2a2a2a; color: #fff; border: 1px solid #444; }
    button { font-weight: bold; cursor: pointer; background: #ffc107; color: #000; }
    button:hover { background: #e0a800; }
    .hidden { display: none; }
    .student-header { display: flex; justify-content: space-between; align-items: center; background: #222; padding: 12px 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #444; font-size: 14px; flex-wrap: wrap; gap: 5px; }
    .video-card { background: #252525; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #333; }
    .video-info h4 { margin: 0 0 5px 0; color: #ffc107; font-size: 16px; }
    .video-info p { margin: 0 0 5px 0; color: #aaa; font-size: 13px; }
    .btn-unlock { background: #28a745; color: #fff; padding: 10px 15px; border-radius: 6px; width: 100%; font-size: 14px; }
    .btn-play-action { background: #00bcd4; color: #000; padding: 10px 15px; border-radius: 6px; width: 100%; font-size: 14px; font-weight: bold; }
    
    /* حاوية الفيديو مع تفعيل خاصية التكبير المطلق */
    .video-container { margin-top: 10px; position: relative; width: 100%; padding-top: 56.25%; background: #000; border-radius: 8px; overflow: hidden; }
    .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
    
    /* حجب شريط جوجل درايف العلوي لمنع التسريب مع إبقاء زر التكبير السفلي يعمل بحرية */
    .shield-top { position: absolute; top: 0; left: 0; width: 100%; height: 45px; background: transparent; z-index: 99; }

    .support-btn { display: block; background: #25d366; color: #fff; text-align: center; padding: 12px; border-radius: 8px; text-decoration: none; font-weight: bold; margin-top: 15px; }
    .msg { font-size: 13px; text-align: center; margin-top: 5px; }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- قسم تسجيل الدخول -->
    <div id="login-section" class="card">
      <h2>🎓 تسجيل دخول الطالب</h2>
      <label>البريد الإلكتروني:</label>
      <input type="email" id="login-email" placeholder="student@example.com">
      
      <label>كلمة المرور:</label>
      <input type="password" id="login-password" placeholder="******">
      
      <label>الصف الدراسي:</label>
      <select id="login-grade">
        <option value="الصف الرابع الابتدائي">الصف الرابع الابتدائي</option>
        <option value="الصف الخامس الابتدائي">الصف الخامس الابتدائي</option>
        <option value="الصف السادس الابتدائي">الصف السادس الابتدائي</option>
        <option value="الصف الأول الاعدادي">الصف الأول الاعدادي</option>
        <option value="الصف الثاني الاعدادي">الصف الثاني الاعدادي</option>
        <option value="الصف الثالث الاعدادي">الصف الثالث الاعدادي</option>
      </select>

      <button onclick="studentLogin()">تسجيل الدخول 🚀</button>
      <p id="login-msg" class="msg" style="color: #ff4d4d;"></p>
      
      <a class="support-btn" href="https://wa.me/201205206388" target="_blank">💬 التواصل مع الدعم الفني (واتساب)</a>
    </div>

    <!-- قسم لوحة الطالب بعد الدخول -->
    <div id="student-dashboard" class="card hidden">
      <div class="student-header">
        <div>مرحباً: <span id="lbl-student-email" style="color: #ffc107;"></span></div>
        <div>الصف: <span id="lbl-student-grade" style="color: #00bcd4;"></span></div>
        <div>الرصيد: <span id="lbl-student-balance" style="color: #28a745; font-weight: bold;">0</span> ج.م</div>
      </div>

      <h2>📚 الفيديوهات المتاحة لصفك الدراسي</h2>
      <div id="videos-list-container">
        <!-- سيتم تحميل الفيديوهات هنا ديناميكياً -->
      </div>
      
      <a class="support-btn" href="https://wa.me/201205206388" target="_blank">💬 واجهتك مشكلة؟ كلم الدعم (واتساب)</a>
      <button onclick="studentLogout()" style="background: #dc3545; color: #fff; margin-top: 15px;">تسجيل الخروج 🚪</button>
    </div>

  </div>

  <script>
    const API_URL = 'https://api.npoint.io/fc637c1cc625a97476e9';
    let currentStudent = null;

    async function fetchData() {
      let res = await fetch(API_URL);
      return await res.json();
    }

    async function saveData(data) {
      await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
    }

    async function studentLogin() {
      let email = document.getElementById('login-email').value.trim();
      let pass = document.getElementById('login-password').value.trim();
      let grade = document.getElementById('login-grade').value;
      let msg = document.getElementById('login-msg');

      if (!email || !pass) {
        msg.innerText = "برجاء إدخال الإيميل وكلمة المرور!";
        return;
      }

      try {
        let db = await fetchData();
        let students = db.students || [];
        
        let found = students.find(s => s.email === email && s.password === pass && s.grade && s.grade.trim() === grade.trim());

        if (!found) {
          msg.innerText = "خطأ في الإيميل، كلمة المرور، أو الصف الدراسي غير متطابق!";
          return;
        }

        currentStudent = found;
        loadStudentDashboard();
      } catch (err) {
        msg.innerText = "خطأ في الاتصال بالسيرفر!";
      }
    }

    // استخراج معرّف ملف جوجل درايف للـ Embed
    function getDriveEmbedUrl(url) {
      if (!url) return "";
      let fileId = "";
      if (url.includes('/file/d/')) {
        let parts = url.split('/file/d/');
        if (parts.length > 1) fileId = parts[1].split('/')[0];
      } else if (url.includes('id=')) {
        let urlParams = new URLSearchParams(url.split('?')[1]);
        fileId = urlParams.get('id');
      }
      return fileId ? `https://drive.google.com/file/d/${fileId}/preview` : url;
    }

    async function loadStudentDashboard() {
      document.getElementById('login-section').classList.add('hidden');
      document.getElementById('student-dashboard').classList.remove('hidden');
      
      document.getElementById('lbl-student-email').innerText = currentStudent.email;
      document.getElementById('lbl-student-grade').innerText = currentStudent.grade;
      document.getElementById('lbl-student-balance').innerText = currentStudent.الرصيد !== undefined ? currentStudent.الرصيد : 0;

      let db = await fetchData();
      let allVideos = db.videos || [];
      let container = document.getElementById('videos-list-container');
      container.innerHTML = "";

      let studentVideos = allVideos.filter(v => v.videoGrade && v.videoGrade.trim() === currentStudent.grade.trim());

      if (studentVideos.length === 0) {
        container.innerHTML = `<p style="text-align: center; color: #aaa;">لا توجد فيديوهات متاحة لصفك حالياً.</p>`;
        return;
      }

      let viewsMap = {};
      let watchedRaw = (currentStudent.المشاهدات || "").split(',');
      watchedRaw.forEach(item => {
        let parts = item.split(':');
        if(parts.length >= 1 && parts[0].trim() !== "") {
          let title = parts[0].trim();
          let count = parts[1] ? parseInt(parts[1]) : 1;
          viewsMap[title] = count;
        }
      });

      studentVideos.forEach(v => {
        let title = v.videoTitle;
        let price = v.videoPrice || 0;
        let viewsUsed = viewsMap[title] || 0; 
        let embedUrl = getDriveEmbedUrl(v.videoUrl);

        let actionHtml = "";

        if (viewsUsed === 0) {
          actionHtml = `<button class="btn-unlock" onclick="unlockVideo('${title}', ${price})">فتح الدرس بـ ${price} ج.م 🔓</button>`;
        } else if (viewsUsed === 1) {
          actionHtml = `
            <p style="color: #ffc107; font-size: 12px; margin-bottom: 5px;">⚠️ متبقي لك مشاهدة واحدة فقط من أصل مرتين.</p>
            <button class="btn-play-action" onclick="playVideo('${title}')">مشاهدة المرة الثانية والأخيرة 📺</button>
            <div class="video-container" style="margin-top:10px;">
              <div class="shield-top"></div>
              <iframe src="${embedUrl}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen="true" webkitallowfullscreen="true" mozallowfullscreen="true"></iframe>
            </div>
          `;
        } else {
          actionHtml = `
            <p style="color: #ff4d4d; font-size: 13px; font-weight: bold; text-align: center; margin-bottom:10px;">❌ لقد استنفدت الحد الأقصى للمشاهدة (مرتان).</p>
            <div class="video-container" style="opacity: 0.3; pointer-events: none;">
              <iframe src="${embedUrl}" allowfullscreen="true"></iframe>
            </div>
          `;
        }

        container.innerHTML += `
          <div class="video-card">
            <div class="video-info">
              <h4>${title}</h4>
              <p>السعر: ${price} ج.م | عدد المشاهدات المستهلكة: <span style="color:#ffc107">${viewsUsed}</span> / 2</p>
            </div>
            <div>
              ${actionHtml}
            </div>
          </div>
        `;
      });
    }

    async function unlockVideo(title, price) {
      let currentBalance = Number(currentStudent.الرصيد || 0);

      if (currentBalance < price) {
        alert("رصيدك غير كافي لفتح هذا الفيديو! برجاء التواصل مع الدعم لشحن الرصيد.");
        return;
      }

      if (!confirm(`هل تريد خصم ${price} ج.م وفتح أول مشاهدة لهذا الدرس؟`)) return;

      let db = await fetchData();
      let studentInDb = (db.students || []).find(s => s.email === currentStudent.email);
      
      if (studentInDb) {
        studentInDb.الرصيد = Number(studentInDb.الرصيد || 0) - price;
        
        let viewsMap = {};
        let watchedRaw = (studentInDb.المشاهدات || "").split(',');
        watchedRaw.forEach(item => {
          let parts = item.split(':');
          if(parts[0].trim() !== "") viewsMap[parts[0].trim()] = parts[1] ? parseInt(parts[1]) : 1;
        });

        viewsMap[title] = 1;

        let newWatchedArr = [];
        for (let key in viewsMap) {
          newWatchedArr.push(`${key}:${viewsMap[key]}`);
        }
        studentInDb.المشاهدات = newWatchedArr.join(',');

        await saveData(db);
        currentStudent = studentInDb;
        
        alert("تم فتح الفيديو بنجاح ومبروك أول مشاهدة! 🎉");
        loadStudentDashboard();
      }
    }

    async function playVideo(title) {
      if (!confirm("هذه هي محاولتك الأخيرة لمشاهدة الفيديو. هل أنت مستعد؟")) return;

      let db = await fetchData();
      let studentInDb = (db.students || []).find(s => s.email === currentStudent.email);
      
      if (studentInDb) {
        let viewsMap = {};
        let watchedRaw = (studentInDb.المشاهدات || "").split(',');
        watchedRaw.forEach(item => {
          let parts = item.split(':');
          if(parts[0].trim() !== "") viewsMap[parts[0].trim()] = parts[1] ? parseInt(parts[1]) : 1;
        });

        viewsMap[title] = 2;

        let newWatchedArr = [];
        for (let key in viewsMap) {
          newWatchedArr.push(`${key}:${viewsMap[key]}`);
        }
        studentInDb.المشاهدات = newWatchedArr.join(',');

        await saveData(db);
        currentStudent = studentInDb;

        loadStudentDashboard();
      }
    }

    function studentLogout() {
      currentStudent = null;
      document.getElementById('student-dashboard').classList.add('hidden');
      document.getElementById('login-section').classList.remove('hidden');
      document.getElementById('login-email').value = "";
      document.getElementById('login-password').value = "";
      document.getElementById('login-msg').innerText = "";
    }
  </script>
</body>
</html>
